name: Deploy site and OpenAPI to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate OpenAPI artifact
        run: npm run generate:openapi

      - name: Build the interactive workflow and Pages artifact
        run: |
          npm ci --prefix site/animation --no-audit --no-fund
          npm exec --prefix site/animation -- vite build site/animation --base=./
          node scripts/build-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN != '' && secrets.PAGES_TOKEN || github.token }}
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .openapi-build/site/apps/openapi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
