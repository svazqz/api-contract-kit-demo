name: "Validation"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: "JavaScript validation"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 16
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Build and run headless browser tests"
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --init --shm-size=1g \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            mcr.microsoft.com/playwright:v1.64.1-noble sh /src/tests/browser/container.sh | tee -a "$GITHUB_STEP_SUMMARY"
